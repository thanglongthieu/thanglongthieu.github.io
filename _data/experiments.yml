# The studio's experiment registry — the single source of truth for every card on the site.
#
#   id        folder name / stable slug
#   path      where the experiment lives (kept stable so old links keep working)
#   track     one of the ids in _data/tracks.yml
#   kind      tool | scene | simulation | drill | game
#   question  the open question the experiment is built to poke at
#   stack     main browser technologies it relies on
#   featured  shown on the home page when true

